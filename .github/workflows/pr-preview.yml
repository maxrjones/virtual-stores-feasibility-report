# Stage 1 of the PR preview: render the site with a read-only token.
#
# Runs on pull_request, so it works for PRs from forks, but GitHub gives
# fork PRs a read-only GITHUB_TOKEN. This workflow therefore only builds
# and uploads the rendered site; pr-preview-deploy.yml (triggered by
# workflow_run, running trusted code from main) pushes it to gh-pages.
name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: github.event.action != 'closed'

      - name: Set up Quarto
        if: github.event.action != 'closed'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        if: github.event.action != 'closed'
        run: quarto render

      - name: Record PR number and action
        run: |
          mkdir -p _preview-meta
          echo "${{ github.event.number }}" > _preview-meta/pr-number
          if [ "${{ github.event.action }}" = "closed" ]; then
            echo remove > _preview-meta/action
          else
            echo deploy > _preview-meta/action
          fi

      - name: Upload preview metadata
        uses: actions/upload-artifact@v7
        with:
          name: preview-meta
          path: _preview-meta/
          retention-days: 1

      - name: Upload rendered site
        if: github.event.action != 'closed'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
          retention-days: 1
